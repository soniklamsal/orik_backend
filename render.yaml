# Render Blueprint: create the web service and its database in one step.
# In Render: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: orik-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: orik-db
          property: connectionString
      # Set these in the dashboard once the frontend domain is live.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      # Admin login, created on first deploy. Set them before deploying.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: orik-db
    plan: free
    databaseName: orik
    user: orik
